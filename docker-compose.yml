services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms
    ports:
      - "7500:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "7501:9000"
      - "7502:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://dms:dms@db:5432/dms
      JWT_SECRET: change_me_in_prod
      AI_SERVICE_URL: http://pfe-ai:5000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      S3_BUCKET: dms
      CORS_ORIGIN: http://localhost:7505
    ports:
      - "7503:8080"
    depends_on:
      db:
        condition: service_healthy
      pfe-ai:
        condition: service_started
      minio:
        condition: service_started

  pfe-ai:
    build:
      context: ./ai-service
    environment:
      FLASK_ENV: development
      PORT: 5000
    ports:
      - "7504:5000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:7503
    ports:
      - "7505:5173"
    depends_on:
      - backend

volumes:
  db_data:
  minio_data:
